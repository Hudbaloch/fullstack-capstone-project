<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiftLink</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      text-align: center;
    }

    .hero {
      padding: 100px 20px;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      color: #555;
      max-width: 650px;
      margin: 0 auto 35px;
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>🎁 GiftLink</h1>

    <p>
      Give away household items you no longer need and discover
      useful free items from your community.
    </p>

    <a href="#" class="btn">Get Started</a>
  </div>

</body>
</html>
